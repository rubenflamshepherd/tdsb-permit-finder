name: Keep scheduled workflows active

on:
  workflow_dispatch:
    inputs:
      force:
        description: Create a heartbeat regardless of repository age
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly on Wednesday at 06:37 UTC.
    - cron: "37 6 * * 3"

permissions:
  contents: write

concurrency:
  group: scheduled-workflow-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Refresh repository activity when needed
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Create heartbeat after prolonged inactivity
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FORCE_HEARTBEAT: ${{ inputs.force || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          last_commit_epoch="$(git log -1 --format=%ct)"
          now_epoch="$(date -u +%s)"
          age_days="$(( (now_epoch - last_commit_epoch) / 86400 ))"

          if [[ "$FORCE_HEARTBEAT" != "true" && "$age_days" -lt 35 ]]; then
            echo "Latest commit is ${age_days} days old; no heartbeat needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflows active"
          git push origin "HEAD:${DEFAULT_BRANCH}"
