name: Sync inventory

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 07:15 UTC.
    - cron: "15 7 * * 0"

permissions:
  contents: read

concurrency:
  group: sync-inventory-production
  cancel-in-progress: false

jobs:
  sync-inventory:
    name: Sync production inventory
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_JSON }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Sync inventory
        run: npm run sync:inventory
        env:
          CLOUD_SQL_INSTANCE_CONNECTION_NAME: ${{ vars.CLOUD_SQL_INSTANCE_CONNECTION_NAME }}
          CLOUD_SQL_DATABASE: ${{ vars.CLOUD_SQL_DATABASE }}
          CLOUD_SQL_SCHEMA: ${{ vars.CLOUD_SQL_SCHEMA || 'tdsb_finder' }}
          CLOUD_SQL_USER: ${{ vars.CLOUD_SQL_USER }}
          CLOUD_SQL_PASSWORD: ${{ secrets.CLOUD_SQL_PASSWORD }}
          CLOUD_SQL_POOL_MAX: "10"
          PERMIT_TYPE_ID: ${{ vars.PERMIT_TYPE_ID || '3' }}
          TDSB_BASE_URL: ${{ vars.TDSB_BASE_URL || 'https://tdsb.ebasefm.com' }}
